# production/nginx.conf
# Optimized for Modular Monolith Architecture

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept on;
    use epoll;
}

http {
    # ── WebSocket Header Mapping ──────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance Tuning ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream frontend_upstream {
        server frontend:5173; # Using port from Dockerfile.frontend
        keepalive 32;
    }

    upstream monolith_upstream {
        server backend:4000;
        keepalive 64;
    }

    server {
        listen 80;
        # listen 443 ssl http2; # Enable for production with certs
        
        # ssl_certificate     /etc/ssl/certs/nginx.crt;
        # ssl_certificate_key /etc/ssl/private/nginx.key;

        server_name localhost;

        # ── Frontend & Static Assets ──────────────────────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Browser Caching for Assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend_upstream;
                expires 30d;
                add_header Cache-Control "public, no-transform";
                access_log off;
            }
        }

        # ── Unified API & WebSocket ───────────────────────────────────────────
        location /api {
            limit_req zone=api_limit burst=40 nodelay;
            
            proxy_pass http://monolith_upstream;
            proxy_http_version 1.1;
            
            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running AI predictions or WS heartbeats
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ── Health Check ──
        location /health {
            proxy_pass http://monolith_upstream/health;
        }
    }
}
