name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies (Root)
        run: npm install
        
      - name: Install dependencies (Monolith)
        run: cd modular-monolith && npm install
        
      - name: Lint Root
        run: npm run lint
        
      - name: Build Frontend
        run: npm run build
        
      - name: Archive Frontend Assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  build-images:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download Frontend Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: modular-monolith/dist
          
      - name: Build and push Modular Monolith
        uses: docker/build-push-action@v5
        with:
          context: ./modular-monolith
          push: true
          tags: ghcr.io/${{ github.repository }}/monolith:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
