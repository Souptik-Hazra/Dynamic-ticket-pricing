<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FanFever Tickets</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      // Console Sanitizer: Silences unavoidable errors from browser extensions
      window.addEventListener('error', function(e) {
        if (e.message.includes('querySelector') || e.filename.includes('extension')) {
          e.stopImmediatePropagation();
        }
      }, true);
      
      // Silence specifically the one from the logs
      const originalConsoleError = console.error;
      console.error = function() {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('querySelector')) return;
        originalConsoleError.apply(console, arguments);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
