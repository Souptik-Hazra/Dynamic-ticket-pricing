version: '3.8'

services:
  # 🚀 Node.js API Service
  app:
    build: .
    container_name: fan-fever-api
    ports:
      - "${PORT:-4000}:4000"
    # Use unified root .env to avoid per-module env files
    env_file: ../.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/fanfever
      - REDIS_URI=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - mongo
      - redis
      - neo4j
    networks:
      - fanfever-network
    restart: always

  # 🍃 MongoDB (Primary Store)
  mongo:
    image: mongo:latest
    container_name: fan-fever-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fanfever-network
    restart: always

  # 🧊 Redis (Cache & Session)
  redis:
    image: redis:alpine
    container_name: fan-fever-redis
    ports:
      - "6379:6379"
    networks:
      - fanfever-network
    restart: always

  # 🕸️ Neo4j (Social Graph)
  neo4j:
    image: neo4j:latest
    container_name: fan-fever-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j-data:/data
    networks:
      - fanfever-network
    restart: always

networks:
  fanfever-network:
    driver: bridge

volumes:
  mongo-data:
  neo4j-data:
