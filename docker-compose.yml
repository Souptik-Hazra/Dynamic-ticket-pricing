version: '3.8'

services:
  # ── Infrastructure (Shared) ────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: fanfever_db
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: fanfever_cache
    ports: ["6379:6379"]

  neo4j:
    image: neo4j:latest
    container_name: fanfever_graph
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

  # ── Backend (Modular Monolith + ML Sidecar) ───────────────────────────────
  backend:
    build:
      context: ./modular-monolith
      dockerfile: Dockerfile
    container_name: fanfever_monolith
    ports:
      - "4000:4000"
      - "5000:5000"
    env_file: .env
    depends_on:
      - mongodb
      - redis
      - neo4j
    restart: always

  # ── Frontend (React/Vite) ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fanfever_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
  neo4j_data:
