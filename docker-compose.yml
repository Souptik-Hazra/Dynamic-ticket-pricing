version: '3.8'

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: fanfever-db
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: fanfever-cache
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    restart: always

  neo4j:
    image: neo4j:latest
    container_name: fanfever-graph
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: always
      
  # ── Unified Application (Monolith + Frontend + AI) ────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fanfever-app
    ports:
      - "4000:4000"
      - "5000:5000"
    env_file: .env
    depends_on:
      - mongodb
      - redis
      - neo4j
    restart: always

volumes:
  mongo_data:
  neo4j_data:
  redis_data:
